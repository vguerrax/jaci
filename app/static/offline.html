<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2A4B4A">
    <title>Jaci - Modo offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            background: #f5efe4;
            color: #203c3b;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        main {
            max-width: 26rem;
            text-align: center;
        }
        img {
            width: 7rem;
            height: 7rem;
        }
        button {
            border: 0;
            border-radius: 999px;
            padding: 0.8rem 1.2rem;
            background: #2a4b4a;
            color: white;
            font: inherit;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <img src="/static/img/icon-192.png" alt="">
        <h1>Você está offline</h1>
        <p>As telas utilizadas recentemente continuam disponíveis. Reconecte-se para buscar dados novos.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
