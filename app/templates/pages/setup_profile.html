<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil — Jaci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/jaci-theme.css" rel="stylesheet">
</head>

<body class="bg-lunar">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <svg width="56" height="56" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="12" fill="var(--jaci-night)" opacity="0.08" />
                    <path d="M14 5a9 9 0 1 0 6.36 2.64" stroke="var(--jaci-night)" stroke-width="2"
                        stroke-linecap="round" fill="none" />
                    <circle cx="18" cy="10" r="2.5" fill="var(--jaci-night)" opacity="0.6" />
                </svg>
                <h1 class="h2 mt-2">Bem-vindo ao Jaci 🌙</h1>
                <p class="text-clay">Configure seu perfil para continuar</p>
            </div>

            <div class="card-jaci p-4">
                {% if error %}
                <div class="alert alert-danger alert-jaci mb-3">{{ error }}</div>
                {% endif %}

                <form method="post" action="/auth/setup">
                    <div class="mb-3">
                        <label for="name" class="form-label">Seu nome</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name"
                            placeholder="Como quer ser chamado?" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        Salvar e continuar
                        <i class="bi bi-moon-stars-fill"></i>
                    </button>
                </form>

                <p class="text-help text-center mt-3 mb-0">Sua senha é gerenciada pelo Tupã.</p>
            </div>
        </div>
    </div>
</body>

</html>
