<div class="modal fade" id="completeItemModal{{ item.id }}" tabindex="-1"
    aria-labelledby="completeItemLabel{{ item.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form hx-post="/executions/{{ execution.id }}/items/{{ item.id }}/complete" hx-target="#items-container"
                hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('completeItemModal{{ item.id }}')).hide(); }
                  htmx.ajax('GET', '/executions/{{ execution.id }}/sidebar-fragment', {
                    target: '#sidebar-container',
                    swap: 'innerHTML'
                });
                this.reset();
                "
                data-offline-complete-item-form
                data-execution-id="{{ execution.id }}"
                data-item-id="{{ item.id }}">
                <input type="hidden" name="version" value="{{ item.version }}">
                <div class="modal-header">
                    <h3 class="modal-title h6" id="completeItemLabel{{ item.id }}">
                        {% if item.is_completed %}Editar compra{% else %}Comprar{% endif %}: {{ item.name }}
                    </h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Quantidade comprada</label>
                        <input type="number" class="form-control" name="purchased_quantity"
                            value="{{ (item.purchased_quantity if item.purchased_quantity else item.planned_quantity)|quantity }}" step="0.001" min="0.001" required>
                        <div class="form-text">
                            Planejado: {{ item.planned_quantity|quantity }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Valor unitário (R$)</label>
                        <input type="number" class="form-control" name="unit_price" placeholder="0,00" step="0.01"
                            min="0.01" value="{{ item.unit_price if item.unit_price else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Local de compra (opcional)</label>
                        <input type="text" class="form-control" name="location"
                            placeholder="Ex: Supermercado X, Feira Y..." value="{{ item.location or execution.current_location or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observações</label>
                        <textarea class="form-control form-control-sm" name="notes"
                            placeholder="Observações">{{ item.notes or '' }}</textarea>
                    </div>
                </div>
                <div class="modal-footer d-flex align-items-center justify-content-between g-1">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                        <i class="bi bi-x-square"></i>
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary btn-sm">
                        Confirmar
                        <i class="bi bi-check-circle"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    // Aguarda o HTMX inserir o HTML no DOM antes de abrir o modal
    requestAnimationFrame(function () {
        var modalEl = document.getElementById('completeItemModal{{ item.id }}');
        if (modalEl) {
            // Remove qualquer modal antigo para evitar conflitos
            var existingModal = bootstrap.Modal.getInstance(modalEl);
            if (existingModal) {
                existingModal.dispose();
            }

            // Cria e abre novo modal
            var modal = new bootstrap.Modal(modalEl, {
                backdrop: true,
                keyboard: true,
                focus: true,
            });
            modal.show();

            // Limpa o modal do DOM quando fechar
            modalEl.addEventListener('hidden.bs.modal', function () {
                modal.dispose();
                modalEl.remove();
            });
        }
    });
</script>
