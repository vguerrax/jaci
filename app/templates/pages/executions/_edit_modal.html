<div class="modal fade" id="editItemModal{{ item.id }}" tabindex="-1"
    aria-labelledby="editItemLabel{{ item.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form hx-post="/executions/{{ execution.id }}/items/{{ item.id }}/edit"
                  hx-target="#items-container"
                  hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) { bootstrap.Modal.getInstance(document.getElementById('editItemModal{{ item.id }}')).hide(); }
                  htmx.ajax('GET', '/executions/{{ execution.id }}/sidebar-fragment', {
                    target: '#sidebar-container',
                    swap: 'innerHTML'
                });
                this.reset();
                ">
                <input type="hidden" name="version" value="{{ item.version }}">
                <div class="modal-header">
                    <h3 class="modal-title h6" id="editItemLabel{{ item.id }}">
                        Editar: {{ item.name }}
                    </h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome do item</label>
                        <input type="text" class="form-control" name="name" value="{{ item.name or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantidade</label>
                        <input type="number" class="form-control" name="planned_quantity" placeholder="1" step="0.01" min="0.01" value="{{item.planned_quantity or 1 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <select class="form-select form-select-sm" name="category_id">
                            <option value="0">Sem categoria</option>
                            {% if active_group %}
                            {% for cat in active_group.categories %}
                            <option value="{{ cat.id }}"{% if cat.id == item.category_id %} selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                            {% endif %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer d-flex align-items-center justify-content-between g-1">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                        <i class="bi bi-x-square"></i>
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary btn-sm">
                        Confirmar
                        <i class="bi bi-check-circle"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    // Aguarda o HTMX inserir o HTML no DOM antes de abrir o modal
    requestAnimationFrame(function() {
        var modalEl = document.getElementById('editItemModal{{ item.id }}');
        if (modalEl) {
            // Remove qualquer modal antigo para evitar conflitos
            var existingModal = bootstrap.Modal.getInstance(modalEl);
            if (existingModal) {
                existingModal.dispose();
            }
            
            // Cria e abre novo modal
            var modal = new bootstrap.Modal(modalEl, {
                backdrop: true,
                keyboard: true,
                focus: true,
            });
            modal.show();
            
            // Limpa o modal do DOM quando fechar
            modalEl.addEventListener('hidden.bs.modal', function() {
                modal.dispose();
                modalEl.remove();
            });
        }
    });
</script>
