{% extends "base.html" %}
{% block title %}Editar Categoria — Jaci{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/categories" class="text-night">Categorias</a></li>
                <li class="breadcrumb-item active text-clay">Editar</li>
            </ol>
        </nav>

        <div class="card-jaci p-4">
            <h1 class="h3 mb-3">Editar Categoria</h1>

            {% if error %}
            <div class="alert alert-danger alert-jaci mb-3">{{ error }}</div>
            {% endif %}

            <form method="post" action="/categories/{{ category.id }}/edit">
                <div class="mb-3">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" class="form-control form-control-lg" id="name" name="name"
                        value="{{ category.name }}" required maxlength="100">
                </div>

                <div class="mb-4">
                    <label for="color" class="form-label">Cor</label>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="color" class="form-control form-control-color" id="color" name="color"
                            value="{{ category.color or '#D9B382' }}" style="width: 56px; height: 42px;">
                        <span class="text-help small">Atual: {{ category.color or 'padrão' }}</span>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a href="/categories" class="btn btn-outline-secondary">
                        <i class="bi bi-x-square"></i>
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary flex-grow-1">
                        Salvar alterações
                        <i class="bi bi-moon-stars-fill"></i>
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <!-- Delete section -->
            <form method="post" action="/categories/{{ category.id }}/delete">
                <button type="submit" class="btn btn-outline-danger btn-sm text-danger w-100">
                    <i class="bi bi-trash"></i>
                    Excluir categoria
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
