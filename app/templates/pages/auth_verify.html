<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando... — Jaci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/jaci-theme.css" rel="stylesheet">
    <style>
        .verify-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .moon-loader {
            width: 48px;
            height: 48px;
            border: 3px solid var(--jaci-sand);
            border-top-color: var(--jaci-night);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-lunar">
    <div class="verify-container">
        <div class="text-center">
            <div class="moon-loader mx-auto mb-3"></div>
            <p class="text-clay">Verificando seu acesso...</p>
            <p class="text-help small">Você será redirecionado automaticamente.</p>
        </div>
    </div>

    <script>
        // Small delay to ensure cookies are set by the browser
        setTimeout(function() {
            window.location.href = "{{ redirect_url | safe }}";
        }, 500);
    </script>
</body>
</html>
