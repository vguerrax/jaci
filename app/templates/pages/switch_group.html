<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocando grupo... — Jaci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/jaci-theme.css" rel="stylesheet">
    <style>
        .switch-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .moon-loader {
            width: 32px;
            height: 32px;
            border: 3px solid var(--jaci-sand);
            border-top-color: var(--jaci-night);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-lunar">
    <div class="switch-container">
        <div class="text-center">
            <div class="moon-loader mx-auto mb-2"></div>
            <p class="text-clay small">Trocando de grupo...</p>
        </div>
    </div>
    <script>
        setTimeout(function () {
            window.location.href = {{ redirect_url | tojson }};
        }, 300);
    </script>
</body>

</html>
